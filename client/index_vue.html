<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Would You Rather?</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    
    <div id="app">
        <h1>Would You Rather....</h1>

        <h2 id="question">{{wyr.question}}</h2>

        <fieldset>
            <input id="answer1-radio" type="radio" name="answer" v-bind:value="wyr.answer1" v-model="userChoice"> 
            <label for="answer1-radio">{{wyr.answer1}}</label>

            <input id="answer2-radio" type="radio" name="answer" v-bind:value="wyr.answer2" v-model="userChoice">
            <label for="answer2-radio">{{wyr.answer2}}</label>
        </fieldset>

        <p v-if="userChoice">Thanks! you chose {{userChoice}}</p>
    </div>
    
    <script>

        const { createApp, onMounted, ref } = Vue

        createApp({
            setup() {
                const wyr = ref({})
                const userChoice = ref('')

                onMounted( () => {
                    fetch('/api/wyr').then( resp => resp.json()).then(wyrData => {
                        wyr.value = wyrData
                    }).catch( err => {
                        console.error(err)
                        alert('Sorry, no WRY questions today')
                    })
                })

                return {
                    wyr,
                    userChoice,
                }
            }
        }).mount('#app')

    </script>

</body>
</html>
